<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>f(x) = 7 - 2|x| の反復とコブウェブ図アニメーション</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #d8d6cd;
    --text: #1a1a18;
    --text-muted: #6b6a63;
    --accent-blue: #185fa5;
    --accent-blue-fill: #378add;
    --accent-red: #993c1d;
    --accent-red-fill: #d85a30;
    --accent-teal: #0f6e56;
    --accent-teal-fill: #1d9e75;
    --accent-gray: #b4b2a9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.sub {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls-row label {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 70px;
  }
  input[type="range"] {
    flex: 1;
    min-width: 140px;
    accent-color: var(--accent-blue-fill);
  }
  .value-badge {
    font-size: 14px;
    font-weight: 600;
    min-width: 56px;
    text-align: right;
  }
  .buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #f0efe9; }
  button:active { transform: scale(0.98); }
  button.primary {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  button.primary:hover { background: #333; }
  canvas {
    display: block;
    width: 100%;
    height: 460px;
    border-radius: 8px;
    background: #fff;
  }
  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .dash { background-image: linear-gradient(to right, var(--accent-gray) 50%, transparent 50%); background-size: 6px 3px; height: 2px; }
  .seq-title {
    font-size: 13px;
    color: var(--text-muted);
    margin: 4px 0 8px;
  }
  #seq {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: #f0efe9;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    border: 1px solid transparent;
  }
  .chip.current {
    background: #e6f1fb;
    border-color: var(--accent-blue-fill);
    color: var(--accent-blue);
    font-weight: 600;
  }
  .note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>f(x) = 7 - 2|x| の反復合成とコブウェブ図</h1>
  <p class="sub">u0 = a, u(n) = f(u(n-1)) の数列を、y = f(x) と y = x の間を行き来する「コブウェブ図」としてアニメーション表示します。</p>

  <div class="panel">
    <div class="controls-row">
      <label for="a-slider">初期値 a</label>
      <input type="range" id="a-slider" min="-10" max="10" step="0.05" value="1">
      <span class="value-badge" id="a-out">1.00</span>
    </div>
    <div class="controls-row">
      <label for="speed-slider">速度</label>
      <input type="range" id="speed-slider" min="1" max="10" step="1" value="5">
      <span class="value-badge" id="speed-out">5</span>
    </div>
    <div class="controls-row">
      <label for="steps-slider">反復回数</label>
      <input type="range" id="steps-slider" min="4" max="30" step="1" value="14">
      <span class="value-badge" id="steps-out">14</span>
    </div>
    <div class="controls-row">
      <label>グラフ表示</label>
      <label style="display:flex;align-items:center;gap:6px;min-width:auto;cursor:pointer;"><input type="checkbox" id="show-f" checked style="width:14px;height:14px;">y = f(x)</label>
      <label style="display:flex;align-items:center;gap:6px;min-width:auto;cursor:pointer;"><input type="checkbox" id="show-f2" checked style="width:14px;height:14px;">y = f(f(x))</label>
      <label style="display:flex;align-items:center;gap:6px;min-width:auto;cursor:pointer;"><input type="checkbox" id="show-f3" style="width:14px;height:14px;">y = f(f(f(x)))</label>
    </div>
    <div class="buttons">
      <button class="primary" id="play-btn">再生</button>
      <button id="step-btn">1ステップ</button>
      <button id="reset-btn">リセット</button>
    </div>
  </div>

  <div class="panel">
    <canvas id="canvas"></canvas>
    <div class="legend">
      <span><span class="swatch" style="background:var(--accent-blue-fill)"></span>y = f(x)</span>
      <span><span class="swatch" style="background:var(--accent-teal-fill)"></span>y = f(f(x))</span>
      <span><span class="swatch" style="background:#7f77dd"></span>y = f(f(f(x)))</span>
      <span><span class="swatch dash"></span>y = x</span>
      <span><span class="swatch" style="background:var(--accent-red-fill)"></span>コブウェブ (数列の軌跡)</span>
      <span><span class="swatch" style="background:var(--accent-teal-fill); height:8px; width:8px; border-radius:50%;"></span>現在の点</span>
      <span><span class="swatch" style="background:#993c1d; height:8px; width:8px; border-radius:50%;"></span>不動点 (-7, 7/3)</span>
    </div>
    <div class="note" id="divergence-note"></div>
  </div>

  <div class="panel">
    <p class="seq-title">数列 u0, u1, u2, ... (u0 = a)</p>
    <div id="seq"></div>
  </div>
</div>

<script>
function f(x) { return 7 - 2 * Math.abs(x); }
function f2(x) { return f(f(x)); }
function f3(x) { return f(f(f(x))); }

const canvas = document.getElementById('canvas');
const ctxCanvas = canvas.getContext('2d');

const VIEW_MIN = -20;
const VIEW_MAX = 20;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctxCanvas.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function toPx(x, y, w, h) {
  const px = (x - VIEW_MIN) / (VIEW_MAX - VIEW_MIN) * w;
  const py = h - (y - VIEW_MIN) / (VIEW_MAX - VIEW_MIN) * h;
  return [px, py];
}

let curveVisibility = { f: true, f2: true, f3: false };

function drawCurve(fn, color, width, w, h) {
  ctxCanvas.strokeStyle = color;
  ctxCanvas.lineWidth = width;
  ctxCanvas.beginPath();
  let first = true;
  for (let x = VIEW_MIN; x <= VIEW_MAX; x += 0.15) {
    const y = fn(x);
    const [px, py] = toPx(x, y, w, h);
    if (first) { ctxCanvas.moveTo(px, py); first = false; }
    else ctxCanvas.lineTo(px, py);
  }
  ctxCanvas.stroke();
}

function drawAxesAndCurves(w, h) {
  ctxCanvas.clearRect(0, 0, w, h);

  ctxCanvas.strokeStyle = '#e5e3dc';
  ctxCanvas.lineWidth = 1;
  for (let g = VIEW_MIN; g <= VIEW_MAX; g += 5) {
    let [gx] = toPx(g, 0, w, h);
    let [, gy] = toPx(0, g, w, h);
    ctxCanvas.beginPath();
    ctxCanvas.moveTo(gx, 0); ctxCanvas.lineTo(gx, h);
    ctxCanvas.stroke();
    ctxCanvas.beginPath();
    ctxCanvas.moveTo(0, gy); ctxCanvas.lineTo(w, gy);
    ctxCanvas.stroke();
  }

  ctxCanvas.strokeStyle = '#b4b2a9';
  ctxCanvas.lineWidth = 1.5;
  let [ax0, ay0] = toPx(VIEW_MIN, 0, w, h);
  let [ax1, ay1] = toPx(VIEW_MAX, 0, w, h);
  ctxCanvas.beginPath(); ctxCanvas.moveTo(ax0, ay0); ctxCanvas.lineTo(ax1, ay1); ctxCanvas.stroke();
  let [bx0, by0] = toPx(0, VIEW_MIN, w, h);
  let [bx1, by1] = toPx(0, VIEW_MAX, w, h);
  ctxCanvas.beginPath(); ctxCanvas.moveTo(bx0, by0); ctxCanvas.lineTo(bx1, by1); ctxCanvas.stroke();

  ctxCanvas.setLineDash([6, 5]);
  ctxCanvas.strokeStyle = '#b4b2a9';
  ctxCanvas.lineWidth = 1.5;
  let [lx0, ly0] = toPx(VIEW_MIN, VIEW_MIN, w, h);
  let [lx1, ly1] = toPx(VIEW_MAX, VIEW_MAX, w, h);
  ctxCanvas.beginPath(); ctxCanvas.moveTo(lx0, ly0); ctxCanvas.lineTo(lx1, ly1); ctxCanvas.stroke();
  ctxCanvas.setLineDash([]);

  if (curveVisibility.f3) drawCurve(f3, '#7f77dd', 2, w, h);
  if (curveVisibility.f2) drawCurve(f2, '#1d9e75', 2.5, w, h);
  if (curveVisibility.f) drawCurve(f, '#378add', 2.5, w, h);

  const fixedPoints = [-7, 7 / 3];
  fixedPoints.forEach((fp) => {
    const [fx, fy] = toPx(fp, fp, w, h);
    ctxCanvas.fillStyle = '#993c1d';
    ctxCanvas.beginPath();
    ctxCanvas.arc(fx, fy, 6, 0, Math.PI * 2);
    ctxCanvas.fill();
    ctxCanvas.strokeStyle = '#fff';
    ctxCanvas.lineWidth = 2;
    ctxCanvas.stroke();

    const label = 'x = ' + (Number.isInteger(fp) ? fp : fp.toFixed(0) + '/3');
    const niceLabel = fp === -7 ? '(-7, -7)' : '(7/3, 7/3)';
    ctxCanvas.fillStyle = '#993c1d';
    ctxCanvas.font = '12px -apple-system, sans-serif';
    ctxCanvas.textBaseline = 'bottom';
    const offsetX = fp === -7 ? -70 : 10;
    ctxCanvas.fillText(niceLabel, fx + offsetX, fy - 8);
  });
}

let a = parseFloat(document.getElementById('a-slider').value);
let stepsTotal = parseInt(document.getElementById('steps-slider').value, 10);
let speed = parseInt(document.getElementById('speed-slider').value, 10);

let segments = [];
let sequenceValues = [];
let outOfRange = false;

function buildSequence() {
  sequenceValues = [a];
  segments = [];
  let cur = a;
  outOfRange = false;
  for (let i = 0; i < stepsTotal; i++) {
    const next = f(cur);
    sequenceValues.push(next);
    segments.push({ from: [cur, cur], to: [cur, next] });
    segments.push({ from: [cur, next], to: [next, next] });
    if (Math.abs(next) > VIEW_MAX * 1.5) { outOfRange = true; }
    cur = next;
    if (outOfRange) break;
  }
  document.getElementById('divergence-note').textContent = outOfRange
    ? '数列がこの表示範囲を超えて発散しています(|a| > 7 では発散します)。'
    : '';
}

let animProgress = 0;
let animSegmentIndex = 0;
let isPlaying = false;
let rafId = null;
let lastTime = null;

function segmentSpeedPerMs() {
  return 0.0006 * speed;
}

function draw() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  drawAxesAndCurves(w, h);

  ctxCanvas.strokeStyle = '#d85a30';
  ctxCanvas.lineWidth = 2;

  for (let i = 0; i < animSegmentIndex; i++) {
    const seg = segments[i];
    const [x0, y0] = toPx(seg.from[0], seg.from[1], w, h);
    const [x1, y1] = toPx(seg.to[0], seg.to[1], w, h);
    ctxCanvas.beginPath();
    ctxCanvas.moveTo(x0, y0);
    ctxCanvas.lineTo(x1, y1);
    ctxCanvas.stroke();
  }

  let curPointMath = [a, a];
  if (animSegmentIndex < segments.length) {
    const seg = segments[animSegmentIndex];
    const t = animProgress;
    const mx = seg.from[0] + (seg.to[0] - seg.from[0]) * t;
    const my = seg.from[1] + (seg.to[1] - seg.from[1]) * t;
    curPointMath = [mx, my];
    const [x0, y0] = toPx(seg.from[0], seg.from[1], w, h);
    const [x1, y1] = toPx(mx, my, w, h);
    ctxCanvas.beginPath();
    ctxCanvas.moveTo(x0, y0);
    ctxCanvas.lineTo(x1, y1);
    ctxCanvas.stroke();
  } else if (segments.length > 0) {
    const last = segments[segments.length - 1];
    curPointMath = last.to;
  }

  const [px, py] = toPx(curPointMath[0], curPointMath[1], w, h);
  ctxCanvas.fillStyle = '#1d9e75';
  ctxCanvas.beginPath();
  ctxCanvas.arc(px, py, 5, 0, Math.PI * 2);
  ctxCanvas.fill();
  ctxCanvas.strokeStyle = '#fff';
  ctxCanvas.lineWidth = 1.5;
  ctxCanvas.stroke();
}

function renderSeqChips(highlightIndex) {
  const seqEl = document.getElementById('seq');
  seqEl.innerHTML = '';
  sequenceValues.forEach((v, n) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (n === highlightIndex ? ' current' : '');
    const rounded = Math.round(v * 1000) / 1000;
    chip.innerHTML = '<span style="color:var(--text-muted)">u' + n + ' = </span>' + rounded;
    seqEl.appendChild(chip);
  });
}

function currentSeqIndex() {
  return Math.min(Math.floor(animSegmentIndex / 2) + 1, sequenceValues.length - 1);
}

function animate(timestamp) {
  if (lastTime === null) lastTime = timestamp;
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  if (isPlaying && animSegmentIndex < segments.length) {
    animProgress += dt * segmentSpeedPerMs();
    if (animProgress >= 1) {
      animProgress = 0;
      animSegmentIndex += 1;
    }
  } else if (isPlaying && animSegmentIndex >= segments.length) {
    isPlaying = false;
    document.getElementById('play-btn').textContent = '再生';
  }

  draw();
  renderSeqChips(currentSeqIndex());

  if (isPlaying) {
    rafId = requestAnimationFrame(animate);
  } else {
    rafId = null;
  }
}

function startAnimation() {
  if (animSegmentIndex >= segments.length) {
    animSegmentIndex = 0;
    animProgress = 0;
  }
  isPlaying = true;
  document.getElementById('play-btn').textContent = '一時停止';
  lastTime = null;
  if (!rafId) rafId = requestAnimationFrame(animate);
}

function pauseAnimation() {
  isPlaying = false;
  document.getElementById('play-btn').textContent = '再生';
}

function resetAnimation() {
  pauseAnimation();
  animSegmentIndex = 0;
  animProgress = 0;
  lastTime = null;
  draw();
  renderSeqChips(0);
}

function stepOnce() {
  pauseAnimation();
  if (animSegmentIndex < segments.length) {
    animSegmentIndex += 1;
    animProgress = 0;
  }
  draw();
  renderSeqChips(currentSeqIndex());
}

const aSlider = document.getElementById('a-slider');
const aOut = document.getElementById('a-out');
const speedSlider = document.getElementById('speed-slider');
const speedOut = document.getElementById('speed-out');
const stepsSlider = document.getElementById('steps-slider');
const stepsOut = document.getElementById('steps-out');
const playBtn = document.getElementById('play-btn');
const stepBtn = document.getElementById('step-btn');
const resetBtn = document.getElementById('reset-btn');

aSlider.addEventListener('input', () => {
  a = parseFloat(aSlider.value);
  aOut.textContent = a.toFixed(2);
  buildSequence();
  resetAnimation();
});

speedSlider.addEventListener('input', () => {
  speed = parseInt(speedSlider.value, 10);
  speedOut.textContent = speed;
});

stepsSlider.addEventListener('input', () => {
  stepsTotal = parseInt(stepsSlider.value, 10);
  stepsOut.textContent = stepsTotal;
  buildSequence();
  resetAnimation();
});

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    pauseAnimation();
  } else {
    startAnimation();
  }
});

stepBtn.addEventListener('click', stepOnce);
resetBtn.addEventListener('click', resetAnimation);

document.getElementById('show-f').addEventListener('change', (e) => {
  curveVisibility.f = e.target.checked;
  draw();
});
document.getElementById('show-f2').addEventListener('change', (e) => {
  curveVisibility.f2 = e.target.checked;
  draw();
});
document.getElementById('show-f3').addEventListener('change', (e) => {
  curveVisibility.f3 = e.target.checked;
  draw();
});

window.addEventListener('resize', resizeCanvas);

aOut.textContent = a.toFixed(2);
speedOut.textContent = speed;
stepsOut.textContent = stepsTotal;
buildSequence();
resizeCanvas();
renderSeqChips(0);
</script>
</body>
</html>
